project:
  type: website
  output-dir: _site
  pre-render:
    - R/logo.R        # régénère images/logo.png dans la couleur --purple de styles.css
    - R/archives.R    # regroupe les PDF des diapos en deux archives ZIP (présentation, imprimable)
  resources:
    - "diapos/Module *.pdf"            # PDF compilés par diapos/compiler.sh (voir le workflow)
    - "diapos/*.zip"                   # archives ZIP produites par R/archives.R
    - "recueil/recueil-STT-1000.pdf"   # PDF compilé par recueil/compiler.sh (voir le workflow)

website:
  title: "STT-1000 Probabilités et statistique"
  site-url: https://julienmiron.github.io/STT-1000/
  repo-url: https://github.com/JulienMiron/STT-1000
  repo-actions: [edit, issue]

  page-footer:
    left: "Site de cours STT-1000"
    center: "[Julien Miron](https://julienmiron.github.io/SitePerso/)"
    right: "Généré avec Quarto"

  navbar:
    background: "#0E9E6C"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Accueil
      - href: diapos.qmd
        text: Diapositives
    tools:
      - toggle-appearance: true

  reader-mode: true

# Réglages de langue et de dates (affichage en français)
lang: fr
language:
  title-block-author-single: "Auteur"
  title-block-modified: "Dernière modification"
date-modified: last-modified       # date mise à jour automatiquement au rendu
date-format: "D MMMM YYYY"

format:
  html:
    favicon: images/favicon.png
    theme:
      light: lumen
      dark: darkly
    css: styles.css
    toc: false

editor: source
